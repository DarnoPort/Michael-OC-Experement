name: Debug Michael OS EIP

on:
  push:
    branches:
      - "phase-18-argv"

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib nasm binutils

      - name: Build kernel
        run: |
          git fetch --no-tags --depth=1 origin a94480a0f9eff1b545b08b425ed1eac39c79ad59
          git checkout a94480a0f9eff1b545b08b425ed1eac39c79ad59
          make clean && make

      - name: Inspect fault EIP
        run: |
          echo "=== SYMBOLS NEAR 0x0010614B ==="
          nm -n myos.bin | awk '$1 >= "00105000" && $1 <= "00107500" {print}'
          echo
          echo "=== DISASSEMBLY AROUND 0x0010614B ==="
          objdump -D -Mintel --start-address=0x00105F00 --stop-address=0x00106300 myos.bin
          echo
          echo "=== SECTIONS ==="
          objdump -h myos.bin
